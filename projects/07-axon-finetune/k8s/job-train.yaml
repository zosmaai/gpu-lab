apiVersion: batch/v1
kind: Job
metadata:
  name: axon-finetune
  namespace: default
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: axon-train
        image: localhost:5000/axon-finetune:latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex

          echo "=== GPU info ==="
          python3 -c "import torch; print(f'GPU: {torch.cuda.get_device_name(0)}, VRAM: {torch.cuda.get_device_properties(0).total_memory/1e9:.1f}GB')"

          echo "=== Step 1: LoRA Training ==="
          python3 -u /opt/scripts/train.py

          echo "=== Step 2: Merge + ONNX Export + Push to HF ==="
          python3 -u /opt/scripts/merge_and_export.py

          echo "=== All done ==="
        env:
        - name: HF_TOKEN
          value: "${HF_TOKEN}"
        - name: HF_HOME
          value: /workspace/hf_cache
        - name: DATASET_PATH
          value: /opt/data/dataset.jsonl
        - name: OUTPUT_DIR
          value: /workspace/lora-adapter
        - name: LORA_PATH
          value: /workspace/lora-adapter
        - name: MERGED_PATH
          value: /workspace/merged
        - name: ONNX_PATH
          value: /workspace/onnx
        - name: NVIDIA_VISIBLE_DEVICES
          value: ${GPU_UUID}
        resources:
          requests:
            memory: 6Gi
            nvidia.com/gpu: "1"
          limits:
            memory: 8Gi
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: scripts
          mountPath: /opt/scripts
          readOnly: true
        - name: data
          mountPath: /opt/data
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: workspace
        hostPath:
          path: /home/akshay/axon-workspace
          type: DirectoryOrCreate
      - name: scripts
        hostPath:
          path: /home/akshay/gpu-lab/projects/07-axon-finetune/scripts
          type: Directory
      - name: data
        hostPath:
          path: /home/akshay/gpu-lab/projects/07-axon-finetune
          type: Directory
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
